name: Simulator checks
on:
  push:
    branches: [swarm-simulator]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node checks.js
      - run: node check-ui.cjs
      - run: python check-browser.py
