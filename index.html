<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Рой · Симулятор</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101a21;color:#eef5f2;font:16px "Segoe UI",sans-serif}main{max-width:1080px;margin:5vh auto;padding:24px}h1{font-size:clamp(30px,5vw,58px);letter-spacing:-.05em;margin:0 0 20px}header,section,footer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}section,footer{margin:14px 0}label{display:flex;align-items:center;gap:8px}button,select,input,.file{font:inherit;color:inherit;border:1px solid #547077;background:#203239;border-radius:7px;padding:8px 12px;cursor:pointer}input{width:100px}.file:focus-within{outline:2px solid white}.file input{position:absolute;width:1px;opacity:0}#start{background:#aaf1ce;color:#143a2b;font-weight:700}canvas{display:block;width:100%;background:#18292d;border-radius:10px;touch-action:manipulation}#stats{font-variant-numeric:tabular-nums;color:#b7efd4}small{color:#b4c5c5}#log{min-height:24px}
</style><main><header><h1>Симулятор роя</h1><b id="stats"></b></header>
<section aria-label="Учебные сценарии"><label>Показ <select id="showcase">
<option value="1">1 · Карта и архитектура</option><option value="2">2 · Один дрон</option>
<option value="3">3 · Группа</option><option value="4" selected>4 · Координация</option></select></label>
<button id="openShow">Открыть показ</button><button id="saveMap">Скачать карту</button></section>
<p id="guide"></p><section><label>Дроны <select id="count"></select></label><label>Ключ карты <input id="seed" type="number" value="42" min="0" max="4294967295"></label><button id="fresh">Новая случайная карта</button><button id="gen">По ключу</button><button id="example">Пример</button><label class="file">Открыть JSON<input id="file" type="file" accept=".json"></label></section>
<section><label>Приоритет <select id="policy"><option value="id">По номеру</option><option value="waiting">Кто дольше ждёт</option></select></label><button id="compare">Сравнить правила</button><output id="comparison"></output></section>
<canvas id="field" width="1000" height="550" aria-label="Карта симуляции"></canvas>
<footer><button id="start">Старт</button><button id="stop">Стоп</button><button id="step">Шаг</button><button id="reset">Сброс</button><small>Щелчок по свободной клетке задаёт финиш и начинает сценарий заново.</small></footer><section><label>История <input id="history" type="range" min="0" max="0" value="0" style="width:min(40vw,300px)"></label><output id="frame"></output><button id="conflict">До первого ожидания</button><button id="replay">С начала записи</button></section><p id="log" role="status"></p></main>
<script src="core.js"></script><script src="demo.js"></script><script src="ui.js"></script></html>
