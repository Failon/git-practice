<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Побег из лабиринта</title>
<style>*{box-sizing:border-box}body{background:#10242a;color:#f2f6f2;font:17px system-ui;margin:0}main{max-width:900px;margin:auto;padding:25px}a{color:#aceccf}h1{font-size:clamp(30px,6vw,52px);margin:14px 0}section{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:14px 0}button,input,select{background:#244449;color:white;border:1px solid #557574;border-radius:7px;padding:9px;font:inherit}button{cursor:pointer}input{width:135px}canvas{width:min(100%,480px);height:auto;background:#182d30;border-radius:10px}button:first-of-type{background:#a8ebc9;color:#14392a}p{line-height:1.5}output{display:block;font-weight:650;margin:12px 0}</style>
<main><a href="../index.html">← Симулятор роя</a><h1>Побег из лабиринта</h1><p>Зелёный круг — беглец. Три оранжевых стража патрулируют лабиринт. Цель — продержаться 200 ходов.</p>
<section><label>Политика <select id="policy"><option value="initial">До обучения · случайно</option><option value="stage1">После этапа 1</option><option value="stage2">После этапа 2</option><option value="stage3" selected>После этапа 3</option><option value="distance">Правило дальности</option></select></label><label>Карта <input id="seed" type="number" min="0" max="4294967295"></label></section>
<canvas width="450" height="450" id="board" aria-label="Поле лабиринта"></canvas><output id="status"></output>
<section><button id="start">Старт</button><button id="pause">Пауза</button><button id="step">Шаг</button><button id="reset">Повторить</button><button id="fresh">Новая карта</button></section>
<p>Смена политики начинает ту же карту с исходных позиций. В каждом повторе стражи выполняют один и тот же патруль.</p></main><script src="game.js"></script><script src="weights.js"></script><script src="view.js"></script></html>
